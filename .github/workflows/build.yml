name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip app
        run: unzip -o calculator_fixed.zip -d app_src

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor Android project
        run: |
          mkdir wrapper
          mv app_src/web wrapper/web
          cd wrapper
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Calculator com.example.calculator --web-dir web
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp wrapper/android/app/build/outputs/apk/debug/app-debug.apk calculator-debug.apk

      - name: Upload to debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug
          name: Debug build
          prerelease: true
          files: calculator-debug.apk
